[package]
autotests = false
name = "cc_plugins"
description = "ConstructCraft Lua scripts and plugins: sandboxed Lua 5.4 over the engine's commands"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
cc_core.workspace = true
cc_engine.workspace = true
cc_script.workspace = true
mlua.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
cc_skp.workspace = true
toml.workspace = true
ureq.workspace = true

[lints]
workspace = true

# A small program the tests of `ccad.process.run` run as an external tool;
# not part of ConstructCraft.
[[bin]]
name = "cc_plugins_test_tool"
path = "src/bin/test_tool.rs"
test = false
doc = false

[[test]]
name = "main"
path = "tests/main.rs"
